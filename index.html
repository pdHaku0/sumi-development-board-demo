<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fefeff">
  <meta name="description" content="Sumi 開発タスクボードの2026年9月17日時点のデモアーカイブ。">
  <title>開発の記録 — Sumi Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;350;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./flow.css">
  <link rel="stylesheet" href="./viewport.css">
  <link rel="stylesheet" href="./mobile-search.css">
  <link rel="stylesheet" href="./motion.css">
  <link rel="stylesheet" href="./demo.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">進捗へ移動</a>
  <main id="main" tabindex="-1">
    <h1 class="sr-only">Sumi 開発タスクのデモアーカイブ</h1>
    <p class="fetch-notice" id="fetch-notice" hidden role="status"></p>
    <nav class="view-nav" aria-label="表示する内容">
      <div class="view-tabs"><button class="view-tab active" data-view="overview" aria-pressed="true">全体の進捗</button><button class="view-tab" data-view="try" aria-pressed="false">いま触れる<span id="try-count" class="tab-count">—</span></button><button class="view-tab" data-view="checks" aria-pressed="false">実機で確かめる<span id="check-count" class="tab-count">—</span></button></div>
      <button class="search-toggle" data-action="search-open" aria-label="タスクを探す" aria-haspopup="dialog"></button>
      <label class="search"><span id="search-icon"></span><input type="search" id="search" placeholder="タスクを探す" aria-label="タスクを探す" autocomplete="off"></label>
    </nav>
    <div id="content"><div class="loading-state"><span class="loading-line"></span><p>作業と検証の状況を読み込んでいます。</p></div></div>
    <footer class="demo-footer"><span id="sync-label"></span><span id="reviewed-label"></span><span class="demo-footer-note">記録を固定した閲覧用デモです。現在の稼働状況ではありません。</span><button class="icon-button" id="refresh" hidden aria-hidden="true" tabindex="-1"></button><div id="connection-info" hidden></div></footer>
  </main>
  <aside id="task-panel" class="task-panel" aria-labelledby="detail-title" hidden><div id="detail"></div></aside>
  <div id="search-overlay" class="search-overlay" role="dialog" aria-modal="true" aria-label="タスクを探す" hidden>
    <div class="search-bar">
      <span class="search-bar-icon" id="search-bar-icon"></span>
      <input type="search" id="search-field" placeholder="タスクを探す" aria-label="タスクを探す" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">
      <button class="search-close" data-action="close-search">閉じる</button>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="live-region" class="sr-only" aria-live="polite"></div>
</body>
</html>
